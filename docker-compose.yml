services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Browser calls the host-mapped gateway port
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - gateway
