services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
      HERMES_DATA_DIR: /app/data
      WEBHOOK_MAX_ATTEMPTS: "3"
      WEBHOOK_RETRY_BASE_MS: "400"
    volumes:
      - hermes-data:/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
    depends_on:
      - gateway

volumes:
  hermes-data:
